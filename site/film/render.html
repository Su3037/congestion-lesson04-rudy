<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>RUDY film renderer</title>
<link rel="stylesheet" href="../fonts/fonts.css">
<style>html,body{margin:0;background:#0b1020}#stage{width:1280px;height:720px}</style>
</head>
<body>
<div id="stage"></div>
<script type="module">
// Frame-exact renderer used for MP4 capture. Contract:
//   window.ready  -> Promise resolved after fixture and fonts load
//   window.clock  -> { fps, duration, cut, lang }
//   window.renderAt(seconds) -> draws that instant from scratch, returns a snapshot
import * as F from "../js/film.js";
const q = new URLSearchParams(location.search);
const cut = q.get("cut") || "full", lang = q.get("lang") || "zh";
const stage = document.getElementById("stage");
window.ready = (async () => {
  await F.loadFixture();
  // make sure every glyph subset used by the film is loaded before capture
  const sample = [];
  for (const sc of F.timeline(cut).scenes) for (const c of sc.cues) sample.push(c.zh, c.en);
  stage.innerHTML = `<div style="position:absolute;opacity:0;font-family:'Noto Sans SC'">${sample.join(" ")}${F.CODE.zh.join(" ")}</div>`;
  await document.fonts.load("16px 'Noto Sans SC'", sample.join(""));
  await document.fonts.load("700 16px 'Noto Sans SC'", sample.join(""));
  await document.fonts.load("16px 'JetBrains Mono'", "demand 0123456789");
  await document.fonts.ready;
  window.clock = { fps: F.FPS, duration: F.duration(cut), cut, lang };
  return true;
})();
window.renderAt = (t) => {
  stage.innerHTML = F.frameMarkup(t, cut, lang);
  const s = F.stateAt(t, cut);
  return { t: s.t, scene: s.scene, cue: s.cueIndex, caption: s.caption[lang], lab: F.labSnapshot(t, cut) };
};
</script>
</body>
</html>
