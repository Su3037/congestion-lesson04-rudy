<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>RUDY 概念小测</title>
<link rel="stylesheet" href="../fonts/fonts.css"><link rel="stylesheet" href="../css/site.css"></head>
<body><main>
<h1>RUDY 概念小测（课前 / 课后）</h1>
<p class="lead">8 道题，约 6 分钟。课前做一次，学完再做一次。不计分，只用来改进课程。结果会下载成 CSV，请发给组织者。</p>
<p><label>代号（不要填真名）：<input id="who"></label> <label>阶段：<select id="phase"><option value="pre">课前</option><option value="post">课后</option></select></label></p>
<ol id="qs"></ol>
<button type="button" id="done">完成并下载</button> <span id="msg" aria-live="polite"></span>
</main>
<script>
// Each item targets one misconception (docs/learner-study.md). Answer keys are in the docs, not shown here.
const Q = [
 ["m1","RUDY 给出的是什么？",["布线器算出的真实走线","布线之前对布线需求的快速估计","制造签核的结果"]],
 ["m2","本课里需求和容量的单位是？",["真实布线轨道数","同一种教学单位，不是轨道数","平方微米"]],
 ["m3","两张热图里颜色一样，说明？",["只有在用同一把固定色尺时，数值才一样","数值一定一样","各自最热的格一样热"]],
 ["m4","把容量从 2 调到 1，需求矩阵会？",["变小","不变","变大"]],
 ["m5","老师的展开布局比聚集布局“更好”吗？",["是，所有指标都更好","要看指标：最大溢出略低，总溢出却高很多","否，所有指标都更差"]],
 ["m6","在模型 P 中，所有格的需求加起来等于？",["格子数","所有 net 的 HPWL 之和","容量 × 格子数"]],
 ["m7","net 从 (1,1) 到 (3,1)，格宽 3。在老师的规则下它选中几格？",["1 格","2 格","3 格"]],
 ["m8","不同工具里的 RUDY 对线状 net（框面积为 0）给出的需求一样吗？",["一样","不一样：有的给正值，有的给 0 或跳过","RUDY 不允许线状 net"]],
];
document.getElementById("qs").innerHTML = Q.map(([id,q,o])=>`<li class="challenge"><p>${q}</p>${o.map((t,i)=>`<label><input type="radio" name="${id}" value="${i}"> ${t}</label><br>`).join("")}<label>把握程度：<select name="${id}-conf"><option value="">请选择</option><option>1 猜的</option><option>2</option><option>3 有把握</option></select></label></li>`).join("");
document.getElementById("done").onclick=()=>{
 const who=document.getElementById("who").value.trim(); if(!who){document.getElementById("msg").textContent="请填写代号。";return;}
 const rows=[["who","phase","item","choice","confidence"]];
 for(const [id] of Q){const c=document.querySelector(`input[name=${id}]:checked`);rows.push([who,document.getElementById("phase").value,id,c?c.value:"",document.querySelector(`select[name=${id}-conf]`).value]);}
 const a=document.createElement("a");a.href=URL.createObjectURL(new Blob([rows.map(r=>r.join(",")).join("\n")],{type:"text/csv"}));a.download=`rudy-quiz-${who}-${document.getElementById("phase").value}.csv`;a.click();
 document.getElementById("msg").textContent="已下载，谢谢！";};
</script></body></html>
