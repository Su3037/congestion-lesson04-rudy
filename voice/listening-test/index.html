<!doctype html>
<html lang="zh-CN">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>配音盲听测试</title>
<style>
:root{--bg:#0b1020;--p:#121a2b;--t:#dfe7fb;--m:#9fb0d3;--a:#8fb5ff;--line:#2a3756}
body{margin:0;background:var(--bg);color:var(--t);font:17px/1.7 "PingFang SC","Microsoft YaHei",system-ui,sans-serif}
main{max-width:760px;margin:auto;padding:16px}
.card{background:var(--p);border:1px solid var(--line);border-radius:10px;padding:12px 16px;margin:14px 0}
.scale{display:flex;gap:6px;flex-wrap:wrap}.scale label{border:1px solid var(--line);border-radius:6px;padding:2px 10px}
button{font:inherit;background:var(--p);color:var(--t);border:1px solid var(--line);border-radius:6px;padding:6px 14px;min-height:40px}
audio{width:100%}small{color:var(--m)}
</style></head>
<body><main>
<h1>配音盲听测试</h1>
<p>你会听到几段相同内容的讲解录音，顺序随机，名字已隐藏。请戴耳机，每段至少听完一遍再打分。没有标准答案，按你的真实感受打分即可。约 8 分钟。</p>
<div class="card">
<label>代号（不要填真名，例如 L03）：<input id="who" required></label><br>
<label>普通话是你的母语吗？ <select id="native"><option value="">请选择</option><option>是</option><option>否</option></select></label>
</div>
<div id="items"></div>
<button id="done" type="button">完成并下载结果</button>
<p id="msg" aria-live="polite"></p>
<p><small>结果只保存在你自己的浏览器里，点“完成”后会下载一个 CSV 文件，请把它发给测试组织者。</small></p>
</main>
<script>
const Q = [
  ["nat", "自然度：听起来像真人在讲课吗？", ["1 很不自然", "2", "3", "4", "5 完全自然"]],
  ["clar", "清晰度：作为学习材料，听得清、跟得上吗？", ["1 很差", "2", "3", "4", "5 很好"]],
  ["hm", "你觉得这段是？", ["真人录音", "机器合成"]],
];
function shuffle(a, seed) { let s = 0; for (const c of seed) s = (s * 31 + c.charCodeAt(0)) >>> 0; for (let i = a.length - 1; i > 0; i--) { s = (s * 1103515245 + 12345) >>> 0; const j = s % (i + 1); [a[i], a[j]] = [a[j], a[i]]; } return a; }
let clips = [];
fetch("clips.json").then(r => r.json()).then(d => { clips = d.clips; draw(); }).catch(() => { document.getElementById("items").innerHTML = "<p>没有找到 clips.json：测试组织者还没有准备录音。</p>"; });
function draw() {
  const who = document.getElementById("who").value || "anon";
  const order = shuffle(clips.slice(), who);
  document.getElementById("items").innerHTML = order.map((c, n) => `<div class="card" data-id="${c.id}"><b>录音 ${n + 1}</b><audio controls preload="none" src="${c.src}"></audio>${Q.map(([k, q, opts]) => `<p>${q}</p><div class="scale">${opts.map((o, i) => `<label><input type="radio" name="${c.id}-${k}" value="${k === "hm" ? (i === 0 ? "human" : "machine") : i + 1}"> ${o}</label>`).join("")}</div>`).join("")}<p><label>备注（可选）：<input name="${c.id}-note" style="width:100%"></label></p></div>`).join("");
}
document.getElementById("who").addEventListener("change", draw);
document.getElementById("done").addEventListener("click", () => {
  const who = document.getElementById("who").value.trim(), native = document.getElementById("native").value;
  if (!who || !native) { document.getElementById("msg").textContent = "请先填写代号和母语。"; return; }
  const rows = [["listener", "native", "clip", "position", "naturalness", "clarity", "human_or_machine", "note"]];
  let missing = 0;
  document.querySelectorAll("#items .card").forEach((el, n) => {
    const id = el.dataset.id, g = (k) => (el.querySelector(`input[name="${id}-${k}"]:checked`) || {}).value || "";
    const r = [who, native, id, n + 1, g("nat"), g("clar"), g("hm"), (el.querySelector(`input[name="${id}-note"]`).value || "").replace(/[\n,]/g, " ")];
    if (!r[4] || !r[5] || !r[6]) missing++;
    rows.push(r);
  });
  if (missing) { document.getElementById("msg").textContent = `还有 ${missing} 段没有打完分。`; return; }
  const blob = new Blob([rows.map(r => r.join(",")).join("\n")], { type: "text/csv" });
  const a = document.createElement("a"); a.href = URL.createObjectURL(blob); a.download = `listening-${who}.csv`; a.click();
  document.getElementById("msg").textContent = "已下载，谢谢！";
});
</script>
</body></html>
